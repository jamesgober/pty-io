# =============================================================================
#  R E P S   ·   pty-io
# =============================================================================
[package]
name    = "pty-io"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Pseudo-terminals for every OS: ConPTY on Windows, posix_openpt on Unix, with child process spawn, resize, and clean teardown."

# Keywords (5 max)
keywords = ["pty", "conpty", "terminal", "process", "io"]

# Categories
categories = ["os", "command-line-interface"]

# Links
homepage      = "https://github.com/jamesgober/pty-io"
repository    = "https://github.com/jamesgober/pty-io"
documentation = "https://docs.rs/pty-io"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pty_io"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = []


# DEPENDENCIES
# #################################
[dependencies]
# First-party -lang dependencies are wired at v0.2.0, when first used.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
